apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-chatbot-deploy
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: medical-chatbot
  template:
    metadata:
      labels:
        app: medical-chatbot
    spec:
      containers:
      - name: chatbot
        image: medical-chatbot:latest
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: chatbot-secrets
        - configMapRef:
            name: chatbot-config
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medical-chatbot-service
  namespace: production
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: medical-chatbot
