# eksctl configuration file to create an AWS EKS Cluster
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: medical-chatbot-eks
  region: us-east-1
  version: "1.28"

managedNodeGroups:
  - name: general-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 4
    volumeSize: 20
    privateNetworking: true
    iam:
      withAddonPolicies:
        autoScaler: true
        albIngress: true  # Enables IAM permissions for AWS Load Balancer Controller
        cloudWatch: true
