# Kubernetes Deployment Manifest for the Medical Chatbot app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-chatbot
  namespace: medical-chatbot
  labels:
    app: medical-chatbot
spec:
  # Maintain high availability with 2 running instances
  replicas: 2
  # Strategy for updating pods with zero-downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # Create 1 new pod before killing old ones
      maxUnavailable: 0 # Ensure 100% target capacity is available during deploy
  selector:
    matchLabels:
      app: medical-chatbot
  template:
    metadata:
      labels:
        app: medical-chatbot
    spec:
      containers:
      - name: chatbot
        image: medical-chatbot:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        # Limit resource usage to prevent cluster starvation
        resources:
          requests:
            cpu: 250m     # Initial request of 0.25 vCPU
            memory: 256Mi # Initial request of 256MB RAM
          limits:
            cpu: 500m     # Hard limit of 0.5 vCPU
            memory: 512Mi # Hard limit of 512MB RAM
        # Source non-sensitive variables from ConfigMap
        envFrom:
        - configMapRef:
            name: medical-chatbot-config
        # Source sensitive credentials from Kubernetes Secrets
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: medical-chatbot-secrets
              key: OPENAI_API_KEY
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: medical-chatbot-secrets
              key: PINECONE_API_KEY
        - name: LANGCHAIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: medical-chatbot-secrets
              key: LANGCHAIN_API_KEY
        # Probe to check if the app needs to be restarted
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 5
        # Probe to check if the app is ready to serve network traffic
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5

