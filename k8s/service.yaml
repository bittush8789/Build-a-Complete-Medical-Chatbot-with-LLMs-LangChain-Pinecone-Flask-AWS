# Kubernetes Service Manifest to internally expose the backend pods
apiVersion: v1
kind: Service
metadata:
  name: medical-chatbot-service
  namespace: medical-chatbot
  labels:
    app: medical-chatbot
spec:
  ports:
  - port: 80          # Service port exposed inside cluster
    targetPort: 8080  # Container port to route the traffic to
    protocol: TCP
    name: http
  # Direct network calls to pods tagged with label "app: medical-chatbot"
  selector:
    app: medical-chatbot
  # Use ClusterIP for secure, internal load balancing inside K8s network
  type: ClusterIP

